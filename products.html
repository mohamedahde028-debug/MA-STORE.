<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنتجات | MA-STORE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f6f6f6}
header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px} header b span{color:#ffcc00}
nav a{color:#fff;text-decoration:none;margin-right:14px;font-size:14px}
.section{padding:20px}
h2{margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card img{width:100%;height:150px;object-fit:cover}
.info{padding:12px}
.price{color:#e60023;font-weight:bold;margin:6px 0}
button{width:100%;background:#111;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:bold;margin-top:6px}
button.add{background:#ffcc00;color:#111}
</style>
</head>
<body>
<header><b>MA<span>-STORE</span></b><nav><a href="index.html">الرئيسية</a><a href="products.html">المنتجات</a><a href="cart.html">السلة</a></nav></header>
<div class="section">
<h2>كل المنتجات 🛍️</h2>
<div class="grid" id="products"></div>
</div>
<script>
const products=[
{id:1,name:"ساعة ذكية فاخرة",price:1250,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"},
{id:2,name:"سماعة بلوتوث أصلية",price:850,img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"},
{id:3,name:"حذاء رياضي مريح",price:1100,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"},
{id:4,name:"كاميرا احترافية",price:3500,img:"https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600"},
{id:5,name:"نظارة شمسية",price:450,img:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=600"},
{id:6,name:"شنطة ظهر",price:650,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600"},
];
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
document.getElementById('products').innerHTML=products.map(p=>`
<div class="card"><img src="${p.img}"><div class="info"><h3>${p.name}</h3><div class="price">${p.price} ج.م</div><button class="add" onclick="add(${p.id})">أضف للسلة +</button><button onclick="location.href='cart.html'">عرض السلة</button></div></div>
`).join('');
function add(id){let item=products.find(p=>p.id==id);cart.push(item);localStorage.setItem('cart',JSON.stringify(cart));alert('تمت الإضافة للسلة ✅')}
</script>
</body>
</html>
