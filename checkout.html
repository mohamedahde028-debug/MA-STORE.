<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتمام الطلب - MA-STORE</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><img src="logo.png" style="width:100px"><nav><a href="index.html">الرئيسية</a><a href="cart.html">السلة</a></nav></header>
<div class="box"><h2>بيانات التوصيل</h2>
<input id="name" placeholder="اسمك"><input id="phone" placeholder="رقم موبايلك"><input id="address" placeholder="العنوان بالتفصيل">
<select id="pay"><option>الدفع عند الاستلام</option><option>فودافون كاش</option><option>انستا باي</option></select>
<button class="btn" style="width:100%;border:0" onclick="sendOrder()">اطلب دلوقتي على واتساب</button></div>
<script>
function sendOrder(){
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
let total=cart.reduce((s,p)=>s+Number(p.price),0);
let msg=`طلب جديد من MA-STORE%0Aالاسم: ${document.getElementById('name').value}%0Aالموبايل: ${document.getElementById('phone').value}%0Aالعنوان: ${document.getElementById('address').value}%0Aالدفع: ${document.getElementById('pay').value}%0A---%0A`+cart.map(p=>p.name+' - '+p.price+' ج').join('%0A')+`%0Aالاجمالي: ${total} ج`;
window.open('https://wa.me/201000000000?text='+msg);
}
</script>
</body></html>
