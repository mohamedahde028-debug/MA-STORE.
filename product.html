<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>تفاصيل المنتج | MA STORE</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .product-details {
            max-width: 1100px;
            width: 92%;
            margin: 50px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            align-items: center;
        }

        .details-image {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            background: #f5f5f5;
            border-radius: 12px;
        }

        .details-info h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--gold);
        }

        .details-price {
            color: var(--gold);
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        .details-description {
            color: #ccc;
            margin-bottom: 25px;
        }

        .details-button {
            background: var(--gold);
            color: #111;
            border: none;
            padding: 14px 30px;
            border-radius: 7px;
            font-weight: bold;
            width: 100%;
        }

        @media(max-width:700px) {
            .product-details {
                grid-template-columns: 1fr;
                margin: 25px auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">MA STORE</a>
        <a href="cart.html" class="primary-button">🛒 السلة</a>
    </header>

    <main>
        <section class="product-details" id="product-details">
            <p>جاري تحميل المنتج...</p>
        </section>
    </main>

    <footer>
        <h3>MA STORE</h3>
        <p>جميع الحقوق محفوظة © 2026</p>
    </footer>

    <script src="js/app.js"></script>

    <script>
        function escapeProductText(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[char]);
        }

        async function loadProductDetails() {
            const container = document.getElementById("product-details");
            const params = new URLSearchParams(window.location.search);
            const productId = params.get("id");

            if (!productId) {
                container.textContent = "المنتج غير موجود.";
                return;
            }

            try {
                const response = await fetch("/api/products");

                if (!response.ok) {
                    throw new Error("تعذر تحميل المنتج");
                }

                const products = await response.json();

                const product = products.find(
                    item => String(item.id) === String(productId)
                );

                if (!product) {
                    container.textContent = "المنتج غير موجود.";
                    return;
                }

                const price = Number(product.price);

                container.innerHTML = `
                    <img
                        class="details-image"
                        src="${escapeProductText(product.image || "assets/images/product-placeholder.png")}"
                        alt="${escapeProductText(product.name)}"
                    >

                    <div class="details-info">
                        <h1>${escapeProductText(product.name)}</h1>

                        <div class="details-price">
                            ${Number.isFinite(price)
                                ? price.toLocaleString("ar-EG") + " جنيه"
                                : "السعر غير متاح"}
                        </div>

                        <p class="details-description">
                            ${escapeProductText(product.description || "منتج مميز من MA STORE.")}
                        </p>

                        <button
                            class="details-button"
                            type="button"
                            id="details-add-button"
                        >
                            أضف إلى السلة
                        </button>
                    </div>
                `;

                document.getElementById("details-add-button")
                    .addEventListener("click", function() {
                        addToCart(product.id);
                    });

            } catch (error) {
                console.error(error);
                container.textContent = "تعذر تحميل المنتج حالياً.";
            }
        }

        document.addEventListener("DOMContentLoaded", loadProductDetails);
    </script>

</body>
</html>
