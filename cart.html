<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلة | MA-STORE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f6f6f6}
header{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px} header b span{color:#ffcc00}
nav a{color:#fff;text-decoration:none;margin-right:14px;font-size:14px}
.section{padding:20px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card img{width:80px;height:80px;object-fit:cover;border-radius:12px}
.price{color:#e60023;font-weight:bold}
input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:10px;font-size:15px}
button{background:#111;color:#fff;border:0;font-weight:bold}
.total{background:#fff;padding:16px;border-radius:16px;margin-top:14px;font-weight:bold;font-size:18px;text-align:center}
.empty{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<header><b>MA<span>-STORE</span></b><nav><a href="index.html">الرئيسية</a><a href="products.html">المنتجات</a><a href="cart.html">السلة</a></nav></header>
<div class="section">
<h2>سلة التسوق 🛒</h2>
<div id="list"></div>
<div id="totalBox"></div>
<div id="formBox" style="display:none">
<h3 style="margin-top:20px">بيانات التوصيل</h3>
<input id="name" placeholder="الاسم بالكامل">
<input id="phone" placeholder="رقم الموبايل">
<input id="address" placeholder="العنوان بالتفصيل">
<button onclick="checkout()">تأكيد الطلب ✅</button>
</div>
</div>
<script>
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
let list=document.getElementById('list');
if(cart.length==0){list.innerHTML='<div class="empty">السلة فاضية<br><br><a href="products.html">تسوق الآن</a></div>'}
else{
let total=0;
list.innerHTML=cart.map((p,i)=>{total+=p.price;return `<div class="card"><img src="${p.img}"><div><h3>${p.name}</h3><div class="price">${p.price} ج.م</div><span onclick="removeItem(${i})" style="color:red;cursor:pointer;font-size:13px">حذف ❌</span></div></div>`}).join('');
document.getElementById('totalBox').innerHTML=`<div class="total">الإجمالي: ${total} ج.م</div>`;
document.getElementById('formBox').style.display='block';
}
function removeItem(i){cart.splice(i,1);localStorage.setItem('cart',JSON.stringify(cart));location.reload()}
function checkout(){
let n=document.getElementById('name').value,ph=document.getElementById('phone').value,ad=document.getElementById('address').value;
if(!n||!ph||!ad){alert('اكمل كل البيانات');return}
let msg='طلب جديد من MA-STORE%0Aالاسم: '+n+'%0Aالموبايل: '+ph+'%0Aالعنوان: '+ad+'%0Aالمنتجات: '+cart.map(p=>p.name).join(' - ');
window.open('https://wa.me/01206094511?text='+msg);
localStorage.removeItem('cart');alert('تم ارسال طلبك بنجاح ✅');location.reload();
}
</script>
</body>
</html>
