<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>السلة - MA-STORE</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><img src="logo.png" style="width:100px"><nav><a href="index.html">الرئيسية</a><a href="products.html">المنتجات</a><a href="cart.html">السلة</a></nav></header>
<div class="box"><h2>سلة التسوق</h2><div id="cartList"></div><h3 id="total"></h3>
<a class="btn" href="checkout.html">اتمام الطلب</a>
<button onclick="clearCart()" style="background:#eee;padding:12px;border:0;border-radius:10px;margin-top:10px;width:100%">مسح السلة</button></div>
<script>
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
let list=document.getElementById('cartList');
let total=0;
list.innerHTML=cart.map(p=>{total+=Number(p.price);return `<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><span>${p.name}</span><b>${p.price} ج</b></div>`}).join('') || 'السلة فاضية';
document.getElementById('total').innerText='الاجمالي: '+total+' ج';
function clearCart(){localStorage.removeItem('cart');location.reload();}
</script>
</body></html>
